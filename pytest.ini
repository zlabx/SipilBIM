[pytest]
markers =
    slow: long fuzz sweeps; deselect with -m "not slow" for a quick run
# SipilBIM: tests that need files this repo does not carry
#   tests/test_dwg_bridge.py::test_the_spec_bundles_it_on_all_three_platforms: reads .github/workflows/release-macos.yml, removed here (only build-windows.yml is kept)
#   tests/test_about_carousel.py::test_the_credits_roll_by_themselves_and_loop: needs the rolling contributors list, which the About dialog no longer has (AboutDialog.credits)
#   tests/test_about_carousel.py::test_the_pointer_stops_the_roll_and_the_wheel_scrolls_it: needs the rolling contributors list, which the About dialog no longer has (AboutDialog.credits)
#   tests/test_extension_manager.py::test_minimum_version_comparison: uses minimum_version "99.0" as "a future version"; this build is 2027.x, already past it
#   tests/test_extension_manager.py::test_incompatible_extension_is_rejected_before_download: uses minimum_version "99.0" as "a future version"; this build is 2027.x, already past it
#   tests/test_extension_manager.py::test_incompatible_extension_is_not_offered_for_install_or_enable: uses minimum_version "99.0" as "a future version"; this build is 2027.x, already past it
addopts =
    --deselect tests/test_dwg_bridge.py::test_the_spec_bundles_it_on_all_three_platforms
    --deselect tests/test_about_carousel.py::test_the_credits_roll_by_themselves_and_loop
    --deselect tests/test_about_carousel.py::test_the_pointer_stops_the_roll_and_the_wheel_scrolls_it
    --deselect tests/test_extension_manager.py::test_minimum_version_comparison
    --deselect tests/test_extension_manager.py::test_incompatible_extension_is_rejected_before_download
    --deselect tests/test_extension_manager.py::test_incompatible_extension_is_not_offered_for_install_or_enable
