[pytest]
markers =
    slow: long fuzz sweeps; deselect with -m "not slow" for a quick run
# SipilBIM: tests that need files this repo does not carry
#   tests/test_dwg_bridge.py::test_the_spec_bundles_it_on_all_three_platforms: reads .github/workflows/release-macos.yml, removed here (only build-windows.yml is kept)
addopts =
    --deselect tests/test_dwg_bridge.py::test_the_spec_bundles_it_on_all_three_platforms
